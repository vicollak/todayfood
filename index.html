<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f97316">
<title>Hôm Nay Ăn Gì?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff7ed; --bg2:#ffe4e6; --bg3:#ede9fe;
  --card:rgba(255,255,255,.78); --card-border:rgba(255,255,255,.9);
  --text:#1f2937; --muted:#6b7280;
  --accent:#f97316; --accent2:#ec4899; --accent3:#eab308;
  --input-bg:rgba(255,255,255,.9);
  --slot1:#312e81; --slot2:#0f172a; --slot-fade:rgba(15,23,42,.92);
  --divider:rgba(0,0,0,.07);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg1:#0c0a14; --bg2:#1a1024; --bg3:#141b2e;
    --card:rgba(30,27,46,.72); --card-border:rgba(255,255,255,.08);
    --text:#f3f4f6; --muted:#9ca3af;
    --input-bg:rgba(255,255,255,.06);
    --slot-fade:rgba(9,12,28,.94);
    --divider:rgba(255,255,255,.08);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",sans-serif;color:var(--text);
  background:linear-gradient(150deg,var(--bg1),var(--bg2) 48%,var(--bg3));
  background-attachment:fixed;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none;
}
body::before{width:420px;height:420px;background:radial-gradient(circle,#fb923c,transparent 70%);top:-120px;right:-100px;animation:float1 14s ease-in-out infinite}
body::after{width:380px;height:380px;background:radial-gradient(circle,#a78bfa,transparent 70%);bottom:-120px;left:-100px;animation:float2 16s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,40px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}

.deco{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.deco span{position:absolute;font-size:34px;opacity:.16;animation:bob 9s ease-in-out infinite}
.deco span:nth-child(1){top:8%;left:6%;animation-delay:0s}
.deco span:nth-child(2){top:16%;right:9%;animation-delay:1.4s}
.deco span:nth-child(3){bottom:22%;left:8%;animation-delay:2.6s}
.deco span:nth-child(4){bottom:10%;right:7%;animation-delay:3.8s}
.deco span:nth-child(5){top:46%;left:2%;animation-delay:5s}
.deco span:nth-child(6){top:58%;right:3%;animation-delay:6.2s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}

.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding:20px 14px 28px;max-width:700px;margin:auto}

.header{text-align:center;padding:14px 0 2px}
.logo{
  width:76px;height:76px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;font-size:40px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px rgba(249,115,22,.45),inset 0 1px 0 rgba(255,255,255,.4);
  animation:bounce-in .8s cubic-bezier(.2,1.4,.4,1) both;
}
.header h1{
  margin:0;font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(120deg,var(--accent),var(--accent2) 60%,#8b5cf6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.header p{margin:6px 0 0;color:var(--muted);font-size:14px}

.card{
  background:var(--card);border:1px solid var(--card-border);border-radius:22px;padding:16px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.row{display:flex;gap:10px}
input{
  flex:1;min-width:0;padding:14px 16px;border:1.5px solid transparent;border-radius:14px;outline:none;
  background:var(--input-bg);color:var(--text);font:inherit;font-size:15px;transition:box-shadow .2s,border-color .2s;
}
input::placeholder{color:var(--muted)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(249,115,22,.18)}

button{border:none;border-radius:14px;padding:12px 18px;cursor:pointer;font:inherit;font-weight:700;color:inherit;background:none;transition:transform .15s,box-shadow .2s,opacity .2s}
button:active{transform:scale(.96)}
.add{
  background:linear-gradient(135deg,var(--accent),#fb923c);color:#fff;
  box-shadow:0 6px 18px rgba(249,115,22,.4);
}
.add:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(249,115,22,.5)}

.list-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.list-head h2{margin:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.count{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.list{max-height:220px;overflow:auto}
#foods{list-style:none;padding:0;margin:0}
#foods li{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 10px 10px 12px;border-radius:12px;border-bottom:1px solid var(--divider);
  animation:slide-in .25s ease both;
}
#foods li:last-child{border-bottom:none}
#foods li:hover{background:var(--input-bg)}
@keyframes slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
#foods .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#foods .name::before{content:"🍽️ ";opacity:.8}
#foods .acts{display:flex;gap:6px;flex:none}
#foods .acts button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;background:var(--input-bg);color:var(--muted)}
#foods .acts button:hover{color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}

.slot{
  height:130px;border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(180deg,var(--slot1),var(--slot2));
  box-shadow:inset 0 2px 12px rgba(0,0,0,.6),0 8px 24px rgba(30,27,129,.35);
}
.slot::before,.slot::after{content:"";position:absolute;top:0;bottom:0;width:26%;z-index:2;pointer-events:none}
.slot::before{left:0;background:linear-gradient(90deg,var(--slot-fade),transparent)}
.slot::after{right:0;background:linear-gradient(-90deg,var(--slot-fade),transparent)}
.slot .shine{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);
  transform:translateX(-100%);animation:sweep 4.5s ease-in-out infinite;
}
@keyframes sweep{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.track{position:absolute;display:flex;align-items:center;height:100%;gap:34px;left:0;top:0;will-change:transform}
.item{font-size:30px;font-weight:800;min-width:200px;text-align:center;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.35)}
.item span{font-size:34px;margin-right:10px}
.marker{
  position:absolute;left:50%;top:10px;bottom:10px;width:3px;z-index:4;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,#facc15 18%,#facc15 82%,transparent);
  box-shadow:0 0 14px rgba(250,204,21,.9);border-radius:99px;
}
.marker::before,.marker::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);border:8px solid transparent;
}
.marker::before{top:-2px;border-top-color:#facc15}
.marker::after{bottom:-2px;border-bottom-color:#facc15}

.random{
  width:100%;margin-top:14px;padding:16px;font-size:18px;color:#fff;letter-spacing:.3px;
  background:linear-gradient(120deg,var(--accent),var(--accent2) 70%,#8b5cf6);
  box-shadow:0 10px 26px rgba(236,72,153,.4);position:relative;overflow:hidden;
}
.random::after{
  content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);
  transform:translateX(-100%);transition:transform .6s;
}
.random:hover::after{transform:translateX(100%)}
.random:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(236,72,153,.5)}
.random:disabled{opacity:.65;cursor:not-allowed;transform:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 10px 26px rgba(236,72,153,.4)}50%{box-shadow:0 10px 40px rgba(236,72,153,.7)}}

.result-card{text-align:center;padding:18px}
.result{font-size:26px;font-weight:800;color:var(--muted);transition:color .3s}
.result.win{
  background:linear-gradient(120deg,var(--accent3),var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;
}
.result small{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:480px){
  .item{font-size:22px;min-width:150px}
  .slot{height:104px}
  .result{font-size:21px}
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span>🍕</span><span>🍔</span><span>🍜</span><span>🍣</span><span>🌮</span><span>🍩</span></div>
<div class="app">
  <header class="header">
    <div class="logo">🍜</div>
    <h1>Hôm nay ăn gì?</h1>
    <p>Không biết ăn gì? Để chiếc máy này quyết định giúp bạn ✨</p>
  </header>

  <div class="card">
    <div class="row">
      <input id="foodInput" placeholder="Thêm món ăn yêu thích..." onkeydown="if(event.key==='Enter')addFood()">
      <button class="add" onclick="addFood()">＋ Thêm</button>
    </div>
  </div>

  <div class="card">
    <div class="list-head"><h2>Danh sách món ăn</h2><span class="count" id="count">0</span></div>
    <div class="list"><ul id="foods"></ul></div>
  </div>

  <div class="card">
    <div class="slot">
      <div class="shine"></div>
      <div class="marker"></div>
      <div id="track" class="track"></div>
    </div>
    <button class="random" id="spinBtn" onclick="spin()">🎲 Quay ngay!</button>
  </div>

  <div class="card result-card"><div id="result" class="result">Chưa chọn món<small>Ấn nút quay để bắt đầu nhé!</small></div></div>
</div>
<canvas id="confetti"></canvas>
<script>
let foods=JSON.parse(localStorage.getItem("foods")||'["Phở","Bún bò","Cơm tấm","Pizza"]');
const $=id=>document.getElementById(id);

function save(){localStorage.setItem("foods",JSON.stringify(foods));render();}
function render(){
  const ul=$("foods");ul.innerHTML="";
  $("count").textContent=foods.length;
  if(foods.length===0){
    const li=document.createElement("li");li.className="empty";
    li.textContent="Chưa có món nào — hãy thêm món ăn đầu tiên!";
    ul.appendChild(li);return;
  }
  foods.forEach((f,i)=>{
    const li=document.createElement("li");
    const name=document.createElement("span");name.className="name";name.textContent=f;
    const acts=document.createElement("span");acts.className="acts";
    const edit=document.createElement("button");edit.textContent="Sửa";edit.onclick=()=>editFood(i);
    const del=document.createElement("button");del.textContent="Xóa";del.onclick=()=>delFood(i);
    acts.append(edit,del);li.append(name,acts);ul.appendChild(li);
  });
}
function addFood(){const v=foodInput.value.trim();if(!v)return;foods.push(v);foodInput.value="";save();foodInput.focus();}
function delFood(i){foods.splice(i,1);save();}
function editFood(i){const v=prompt("Sửa",foods[i]);if(v&&v.trim()){foods[i]=v.trim();save();}}

function fillTrack(items){
  const track=$("track");track.innerHTML="";
  items.forEach(x=>{
    const d=document.createElement("div");d.className="item";
    const e=document.createElement("span");e.textContent="🍜";
    d.append(e,document.createTextNode(x));track.appendChild(d);
  });
}
fillTrack(foods.length?foods:["?","?","?"]);
render();

/* ---- confetti ---- */
const cvs=$("confetti"),ctx=cvs.getContext("2d");let pieces=[],raf=null;
function sizeCanvas(){cvs.width=innerWidth;cvs.height=innerHeight;}
addEventListener("resize",sizeCanvas);sizeCanvas();
const colors=["#f97316","#f43f5e","#eab308","#22c55e","#3b82f6","#a855f7","#fb7185"];
function confetti(){
  for(let i=0;i<130;i++)pieces.push({
    x:Math.random()*cvs.width,y:-20-Math.random()*cvs.height*.5,
    r:4+Math.random()*6,c:colors[i%colors.length],
    vy:2.2+Math.random()*3,vx:-1.2+Math.random()*2.4,
    rot:Math.random()*Math.PI,vr:-.12+Math.random()*.24,
    circle:Math.random()<.35
  });
  if(!raf)raf=requestAnimationFrame(tickConfetti);
}
function tickConfetti(){
  ctx.clearRect(0,0,cvs.width,cvs.height);
  pieces=pieces.filter(p=>p.y<cvs.height+60);
  pieces.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.vy+=.03;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    if(p.circle){ctx.beginPath();ctx.arc(0,0,p.r/1.4,0,7);ctx.fill();}
    else ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.62);
    ctx.restore();
  });
  raf=pieces.length?requestAnimationFrame(tickConfetti):(ctx.clearRect(0,0,cvs.width,cvs.height),null);
}

/* ---- slot spin ---- */
let spinning=false;
async function spin(){
  if(spinning||foods.length===0)return;
  spinning=true;
  const btn=$("spinBtn");btn.disabled=true;
  const winner=foods[Math.floor(Math.random()*foods.length)];
  const track=$("track"),result=$("result");
  result.className="result";result.innerHTML="Đang quay...<small>May mắn sẽ mỉm cười với bạn 🍀</small>";

  const pool=[];
  for(let i=0;i<80;i++)pool.push(foods[Math.floor(Math.random()*foods.length)]);
  pool.push(winner);
  for(let i=0;i<10;i++)pool.push(foods[Math.floor(Math.random()*foods.length)]);
  fillTrack(pool);

  await new Promise(r=>setTimeout(r,60));

  const items=track.querySelectorAll(".item"),winIndex=80,slot=track.parentElement;
  const center=slot.clientWidth/2-items[winIndex].offsetWidth/2;
  const jitter=(Math.random()-.5)*items[winIndex].offsetWidth*.3;
  const target=items[winIndex].offsetLeft-center-jitter;

  track.style.transition="none";track.style.transform="translateX(0px)";
  void track.offsetWidth;
  track.style.transition="transform 5s cubic-bezier(.08,.8,.15,1)";
  track.style.transform=`translateX(${-target}px)`;

  setTimeout(()=>{
    result.className="result win";
    result.innerHTML=`🏆 ${winner}<small>Chúc bạn ngon miệng!</small>`;
    confetti();spinning=false;btn.disabled=false;
  },5100);
}
</script>
</body>
</html>
